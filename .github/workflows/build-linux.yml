name: Build Linux binaries

on:
  push:
    tags:
      - "v*-linux"
  release:
    types: [published]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          pip install pyinstaller pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build salvage (Linux)
        run: pyinstaller --clean salvage-linux.spec 2>/dev/null || pyinstaller --clean -F -n salvage salvage.py

      - name: Build GUI (Linux)
        run: |
          mkdir -p dist/assets
          cp assets/logo.png assets/icon.png dist/assets/ 2>/dev/null || true
          pyinstaller --clean -F -n Video-Fix-98 --add-data "assets:assets" gui.py

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          gh release create "$TAG" \
            dist/salvage dist/Video-Fix-98 \
            --title "Video-Fix-98 — Linux $TAG" \
            --notes "Linux binaries: salvage (CLI) + Video-Fix-98 (GUI). Requires ffmpeg."
